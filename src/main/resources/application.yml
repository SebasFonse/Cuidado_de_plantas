quarkus:
  application:
    name: Plantacert AI
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8080
    root-path: /api
    cors:
      enabled: true
      origins: "http://localhost:5173"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Requested-With

  # Base de datos (valores tomados del archivo .env; si no existe, usa H2 en memoria)
  datasource:
    db-kind: h2
    username: "${DB_USERNAME:sa}"
    password: "${DB_PASSWORD:}"
    jdbc:
      url: "${DB_URL:jdbc:h2:mem:plantacert;DB_CLOSE_DELAY=-1}"

  hibernate-orm:
    schema-management:
      strategy: drop-and-create
    log:
      sql: true

  # Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    file:
      enabled: true
      path: logs/plantacert.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M
        max-backup-index: 5
        file-suffix: yyyy-MM-dd

  swagger-ui:
    enabled: true
    always-include: true
    path: "/swagger-ui"
    title: "Plantacert AI - API"

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Plantacert AI - API Quarkus"
          version: "1.0.0"
          description: "API para la gestión del catálogo y cuidado de plantas - Grupo 5"
