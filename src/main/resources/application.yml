quarkus:
  application:
    name: Plantacert AI
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8080
    root-path: /api
    cors:
      enabled: true
      # Acepta el frontend Flutter web en cualquier puerto de localhost
      origins: "/http://localhost:[0-9]+/"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Requested-With

  # Base de datos: PostgreSQL en Neon.
  # Los datos de conexión se leen del archivo .env (NO se sube a GitHub).
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL}
      max-size: 5
    devservices:
      enabled: false

  hibernate-orm:
    schema-management:
      # update: crea las tablas si no existen y NO borra los datos al reiniciar
      strategy: update
    log:
      sql: true

  # Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    file:
      enabled: true
      path: logs/plantacert.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M
        max-backup-index: 5
        file-suffix: yyyy-MM-dd

  swagger-ui:
    enabled: true
    always-include: true
    path: "/swagger-ui"
    title: "Plantacert AI - API"

mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Plantacert AI - API Quarkus"
          version: "1.0.0"
          description: "API para la gestión del catálogo y cuidado de plantas - Grupo 5"

# Perfil de pruebas (./mvnw test y GitHub Actions):
# usa H2 en memoria para no tocar la base de Neon ni necesitar contraseñas en GitHub.
"%test":
  quarkus:
    datasource:
      db-kind: h2
      username: sa
      password: ""
      jdbc:
        url: "jdbc:h2:mem:plantacert_test;DB_CLOSE_DELAY=-1"
    hibernate-orm:
      schema-management:
        strategy: drop-and-create
    log:
      file:
        enabled: false
